[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ysf-bm-router"
version = "0.1.2"
description = "Local WPSD YSF reflector service that maps Yaesu DG-ID values to BrandMeister DMR talkgroups."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
license-files = ["LICENSE.md", "THIRD_PARTY.md"]
authors = [
    { name = "LZARC" }
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
ysf-bm-router = "ysf_bm_router.cli:main"
ysf-bm-router-admin = "ysf_bm_router.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
